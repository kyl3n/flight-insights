[package]
name = "q22-network-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
uuid = { version = "=1.27.0", features = ["v4"] }
base64 = "=0.22.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp"] }
