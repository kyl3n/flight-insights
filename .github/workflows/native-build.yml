name: Native preview builds

on:
  workflow_dispatch:
    inputs:
      include_macos:
        description: Also qualify experimental macOS targets (Windows/Linux are required)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.include_macos && '[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"deb,appimage"},{"os":"windows-2022","target":"x86_64-pc-windows-msvc","bundles":"nsis"},{"os":"macos-15","target":"aarch64-apple-darwin","bundles":"app,dmg"},{"os":"macos-15-intel","target":"x86_64-apple-darwin","bundles":"app,dmg"}]' || '[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"deb,appimage"},{"os":"windows-2022","target":"x86_64-pc-windows-msvc","bundles":"nsis"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Audit the frozen Python libraries too; changing only this linker target
      # cannot make a newer native dependency compatible with an older macOS.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          enable-cache: true
      - name: Install locked build tools
        run: |
          uv python install 3.12.14
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
          rustup target add ${{ matrix.target }} --toolchain 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config xvfb xauth dbus-x11
      - name: Install locked project dependencies
        run: |
          npm ci
          uv sync --frozen --python 3.12.14
      - name: Parse the offline Windows bench script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($relative in @('scripts/qualify-installed-windows.ps1', 'native-repair/scripts/install-windows.ps1')) {
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $relative), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; throw ('Bench script has PowerShell syntax errors: '+$relative) }
          }
      - name: Engine tests
        timeout-minutes: 20
        run: python scripts/ci-check.py engine-test-output.txt uv run --frozen pytest -v -o faulthandler_timeout=120 --durations=25
      - name: Frozen sidecar smoke
        run: python scripts/ci-check.py engine-package-output.txt uv run --frozen python scripts/package-engine.py --target ${{ matrix.target }}
      - name: Preserve engine failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-failure-${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            engine-test-output.txt
            engine-package-output.txt
      - name: Frontend and native desktop transport checks
        run: |
          npm run build
          python scripts/ci-check.py native-check-desktop-fmt.txt cargo fmt --manifest-path src-tauri/Cargo.toml --check
          python scripts/ci-check.py native-check-desktop-test.txt cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --locked
          python scripts/ci-check.py native-check-desktop-clippy.txt cargo clippy --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --locked -- -D warnings
      - name: Native helper checks without installation
        run: |
          python scripts/ci-check.py native-check-helper-fmt.txt cargo fmt --manifest-path native-repair/Cargo.toml --check
          python scripts/ci-check.py native-check-helper-test.txt cargo test --manifest-path native-repair/Cargo.toml --target ${{ matrix.target }} --locked
          python scripts/ci-check.py native-check-helper-clippy.txt cargo clippy --manifest-path native-repair/Cargo.toml --target ${{ matrix.target }} --locked -- -D warnings
      - name: Preserve native check failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-check-failure-${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
          path: native-check-*.txt
      - name: Build and verify unprivileged diagnostic helper without installation
        run: |
          cargo build --manifest-path native-repair/Cargo.toml --target ${{ matrix.target }} --release --locked
          uv run --frozen python scripts/verify-repair-helper.py --target ${{ matrix.target }} --report native-verification-helper-${{ matrix.target }}.json
      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Preserve locked application dependency graph and upstream notices
        run: uv run --frozen python scripts/application-dependencies.py --target ${{ matrix.target }}
      - name: Browser integration tests on the target operating system
        run: |
          npx playwright install chromium
          npm test
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
          path: test-results/
      - name: Build unsigned preview installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
      - name: Verify every packaged runtime through its native supervisor
        run: |
          verification=(python -X utf8 scripts/ci-check.py native-check-bundle.txt uv run --frozen python -X utf8 scripts/verify-native-bundle.py --target ${{ matrix.target }} --bundle-root src-tauri/target/${{ matrix.target }}/release/bundle --formats ${{ matrix.bundles }} --require-gui --gui-repetitions 3 --report native-verification-${{ matrix.target }}.json)
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- "${verification[@]}"
          else
            "${verification[@]}"
          fi
      - name: Preserve native qualification failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-failure-${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            native-verification-*.json
            native-check-bundle.txt
      - name: Archive macOS app with executable modes and symlinks preserved
        if: runner.os == 'macOS'
        run: |
          python -c 'from pathlib import Path; import shutil; app, = Path("src-tauri/target/${{ matrix.target }}/release/bundle/macos").glob("*.app"); shutil.make_archive(str(app), "gztar", root_dir=app.parent, base_dir=app.name)'
      - name: Save compact native verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            engine-test-output.txt
            engine-package-output.txt
            native-check-*.txt
            native-verification-*.json
            src-tauri/binaries/*.sha256
            src-tauri/binaries/*.inventory.json
      - name: Save unsigned preview installers and engine checksum
        uses: actions/upload-artifact@v4
        with:
          name: q22-foundation-preview-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
            !src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app/**
            src-tauri/binaries/*.sha256
            src-tauri/binaries/*.macos-runtime.json
            src-tauri/binaries/*.inventory.json
            src-tauri/resources/engine/
            native-verification-${{ matrix.target }}.json
            native-verification-helper-${{ matrix.target }}.json
            native-verification-gui-attempts-*.json
            native-repair/target/${{ matrix.target }}/release/q22-network-helper
            native-repair/target/${{ matrix.target }}/release/q22-network-helper.exe
            scripts/qualify-installed-linux.sh
            scripts/qualify-installed-windows.ps1
            native-repair/scripts/
            native-repair/docs/windows-service.md
            docs/linux-private-bench-helper.md
            docs/native-release-checks.md
