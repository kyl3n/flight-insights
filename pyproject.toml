[project]
name = "q22-flight-engine"
version = "0.2.0"
description = "Local evidence, network diagnostics, and parameter-linked flight comparisons"
requires-python = ">=3.12,<3.14"
dependencies = [
    "psutil>=7.2,<8",
    "pyarrow==21.0.0",
    "pymavlink==2.4.49",
]

[project.scripts]
q22-engine = "q22_engine.__main__:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pyinstaller>=6.18,<7"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/q22_engine"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
addopts = "-ra"
